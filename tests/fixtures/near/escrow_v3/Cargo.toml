[package]
name = "escrow_v3"
version = "0.3.0"
edition = "2021"
publish = false
description = "Escrow v3: escrow v2 with a caller check inside migrate() (near-sdk before 5.18.0 does not enforce #[private] on #[init] methods); upgrade scenario scenarios/upgrade/escrow_v1_to_v3_with_migrate.json."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["non-contract-usage"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing"] }
