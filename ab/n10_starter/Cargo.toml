[package]
name = "event_registration"
version = "0.1.0"
edition = "2021"
publish = false
description = "N10 starter: frozen copy of the N06 event_registration contract (study input, do not edit in place)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["non-contract-usage"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing"] }

[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
