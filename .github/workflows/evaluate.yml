name: evaluate

# Builds one NEAR contract crate from any branch and runs scenario files against it in
# near-sandbox, using the same bumm-sim runner as the main CI. Used two ways:
#   - by the author, to score study runs against hidden acceptance scenarios;
#   - by an agent working "with BUMM", as its remote sandbox (the owner's machine has no
#     near-sandbox binary and limited traffic).
# Trigger: gh workflow run evaluate.yml --ref <branch> -f crate_dir=<dir> -f scenarios='<glob>'

on:
  workflow_dispatch:
    inputs:
      crate_dir:
        description: "crate directory on the chosen ref (must build to wasm with rustc 1.85.0)"
        required: true
      scenarios:
        description: "space-separated scenario files or globs, relative to the repo root"
        required: true
      upgrade:
        description: "set to 'candidate' to use the built crate as the upgrade target (initial wasm then comes from each scenario's contract.wasm)"
        required: false
        default: "initial"
      label:
        description: "free text, copied into the report artifact name"
        required: false
        default: "run"
      toolchain:
        description: "rustc toolchain used to build the crate (near-sdk 5.17.2 links to wasm only with 1.85.0)"
        required: false
        default: "1.85.0"

jobs:
  evaluate:
    name: build + simulate (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install the requested toolchain for the contract (default 1.85.0; near-sdk 5.17.2 does not link on newer rustc)
        run: rustup toolchain install "${{ inputs.toolchain }}" --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            ${{ inputs.crate_dir }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the contract wasm (rustc ${{ inputs.toolchain }}, --locked, -p <crate name>)
        id: build
        working-directory: ${{ inputs.crate_dir }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/eval-out"
          # The crate's own name and the target directory (the workspace's, when the crate is a
          # member), read from cargo instead of guessing "the first wasm in target/".
          meta="$GITHUB_WORKSPACE/eval-out/cargo-metadata.json"
          cargo +"${{ inputs.toolchain }}" metadata --no-deps --offline --format-version 1 > "$meta"
          name=$(python3 -c 'import json,os,sys; m=json.load(open(sys.argv[1])); here=os.path.realpath("."); p=[q for q in m["packages"] if os.path.dirname(os.path.realpath(q["manifest_path"]))==here]; assert len(p)==1, [q["name"] for q in m["packages"]]; print(p[0]["name"])' "$meta")
          target_dir=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_directory"])' "$meta")
          cargo +"${{ inputs.toolchain }}" build --release --locked --target wasm32-unknown-unknown -p "$name" 2>&1 \
            | tee "$GITHUB_WORKSPACE/eval-out/build.log"
          wasm="$target_dir/wasm32-unknown-unknown/release/$name.wasm"
          test -f "$wasm" || { echo "no wasm at $wasm"; exit 1; }
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"
          echo "crate=$name" | tee -a "$GITHUB_WORKSPACE/eval-out/build.log"
          sha256sum "$wasm"
      - name: build the fixture wasm files used by upgrade scenarios (rustc 1.85.0)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p event_registration -p event_registration_waitlist -p escrow_v1 -p escrow_v2
      - name: build bumm-sim (rustc 1.99.1)
        working-directory: contracts
        run: cargo build --release --locked -p bumm-sim
      - name: run scenarios
        run: |
          mkdir -p eval-out
          set +e
          if [ "${{ inputs.upgrade }}" = "candidate" ]; then
            WASM_FLAG=(--upgrade-wasm "${{ steps.build.outputs.wasm }}")
          else
            WASM_FLAG=(--wasm "${{ steps.build.outputs.wasm }}")
          fi
          python -m bumm_guard simulate ${{ inputs.scenarios }} "${WASM_FLAG[@]}" \
            --runner contracts/target/release/bumm-sim --out eval-out/simulate-report.json
          echo "simulate exit=$?" | tee eval-out/exit.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.label }}
          path: eval-out/
          if-no-files-found: warn
