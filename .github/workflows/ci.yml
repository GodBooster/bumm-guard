name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rulepack:
    name: rule-pack tests (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install with MCP extra
        run: python -m pip install -e '.[mcp]'
      - name: unit tests (incl. MCP stdio tests)
        run: python -m unittest discover -s tests -v
      - name: scan fixtures (expect 3 findings, exit 1)
        run: |
          set +e
          python -m bumm_guard scan tests/fixtures/near --format json > scan.json
          code=$?
          set -e
          python - <<'EOF'
          import json, sys
          d = json.load(open("scan.json"))
          ids = sorted(f["rule_id"] for f in d["findings"])
          assert ids == ["BG-NEAR-001", "BG-NEAR-002", "BG-NEAR-003"], ids
          print("fixtures OK:", ids)
          EOF
          test "$code" -eq 1

  ui-panel:
    name: ABI panel tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test ui/test
        run: node --test ui/test

  fixtures-compile:
    name: fixtures compile (cargo check, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install the fixtures' pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/fixtures/near
      - name: cargo check (host)
        working-directory: tests/fixtures/near
        run: cargo check --workspace --locked
      - name: cargo check (wasm32)
        working-directory: tests/fixtures/near
        run: cargo check --workspace --locked --target wasm32-unknown-unknown

  # Sandbox tests (near-workspaces / near-sandbox) run only on Linux: near-sandbox has no
  # Darwin-x86_64 binary. This job is enabled once contracts/ with sandbox tests exist.
  sandbox:
    name: sandbox tests (near-workspaces, linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: chk
        name: contracts present?
        run: |
          if ls contracts/*/Cargo.toml contracts/Cargo.toml >/dev/null 2>&1; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "no contracts/ yet - skipping"; fi
      - if: steps.chk.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.chk.outputs.has == 'true'
        name: install the fixtures' pinned toolchain (built by the test as a subprocess)
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - if: steps.chk.outputs.has == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            tests/fixtures/near
      - if: steps.chk.outputs.has == 'true'
        name: cargo test
        working-directory: contracts
        run: cargo test --workspace --locked

  simulate:
    name: scenario runner (bumm-sim on near-sandbox, linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install the fixtures' pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            tests/fixtures/near
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build event_registration wasm (rustc 1.85.0)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p event_registration
      - name: build bumm-sim (rustc 1.99.1)
        working-directory: contracts
        run: cargo build --release --locked -p bumm-sim
      - name: run N06 scenarios
        run: |
          python -m bumm_guard simulate scenarios/n06/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/simulate-report.json
      - name: gate with simulate evidence (binds report to this wasm; blocks on failed scenarios)
        run: |
          python -m bumm_guard gate tests/fixtures/near/event_registration \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/event_registration.wasm \
            --simulate-report simulate-out/simulate-report.json --dry-run
      - name: build event_registration_waitlist wasm (rustc 1.85.0; N10 upgrade target)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p event_registration_waitlist
      - name: upgrade N06 -> N10 with migrate() (expected PASS)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/n06_to_n10_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/upgrade-with-migrate.json
      - name: upgrade N06 -> N10 code only (expected FAIL after the upgrade step)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/n06_to_n10_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/upgrade-code-only.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/upgrade-code-only.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          after = [s for s in sc["steps"] if s["index"] > up]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          # Every step after the upgrade, call and view alike, must name the contract's own failure
          # (the new code cannot read the old state), not only the RPC wrapper (FORMATS §3, error_detail).
          lacking = [s for s in after if "Cannot deserialize" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          views = [s for s in after if s["kind"] == "view"]
          assert views and all("Cannot deserialize" in s["actual"].get("error_detail", "") for s in views), views
          assert r["upgrade_wasm_sha256"] and sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"code-only upgrade: steps 0..{up} passed, {len(after)} step(s) after it failed with "
                f"'Cannot deserialize' ({len(views)} view steps), as expected")
          EOF
      - name: build escrow_v1 and escrow_v2 wasm (rustc 1.85.0; second upgrade pair)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p escrow_v1 -p escrow_v2
      - name: run escrow v1 scenarios
        run: |
          python -m bumm_guard simulate scenarios/escrow/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-report.json
      - name: gate escrow_v1 with its simulate evidence (fresh deploy, no upgrade proof needed)
        run: |
          python -m bumm_guard gate tests/fixtures/near/escrow_v1 \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/escrow_v1.wasm \
            --simulate-report simulate-out/escrow-report.json --dry-run
      - name: upgrade escrow v1 -> v2 with migrate() (expected PASS)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/escrow_v1_to_v2_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-upgrade-with-migrate.json
      - name: upgrade escrow v1 -> v2 code only (expected FAIL after the first view; the smoke view lies)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/escrow_v1_to_v2_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-upgrade-code-only.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/escrow-upgrade-code-only.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          smoke = sc["steps"][up + 1]
          after = [s for s in sc["steps"] if s["index"] > up + 1]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          # The layout change sits inside a map record, not in the root struct, so the smoke view
          # right after the upgrade still answers correctly (deal_count 3): a smoke check cannot
          # see this upgrade failure. Only reading a record fails.
          assert smoke["kind"] == "view" and smoke["method"] == "deal_count" and smoke["passed"], smoke
          assert smoke["actual"]["value"] == 3, smoke
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          # near-sdk store's own message for a record it cannot read (not the root-struct one).
          lacking = [s for s in after if "Cannot deserialize element" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          views = [s for s in after if s["kind"] == "view"]
          assert views and all("Cannot deserialize element" in s["actual"].get("error_detail", "") for s in views), views
          assert r["upgrade_wasm_sha256"] and sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"escrow code-only upgrade: steps 0..{up} passed, deal_count right after it passed (value 3), "
                f"{len(after)} step(s) after that failed with 'Cannot deserialize element' ({len(views)} view steps), as expected")
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulate-report
          path: simulate-out/
          if-no-files-found: warn
      - name: upload the exact wasm the scenarios ran against (deploy this file, not a local rebuild)
        uses: actions/upload-artifact@v4
        with:
          name: event_registration-wasm
          path: tests/fixtures/near/target/wasm32-unknown-unknown/release/event_registration.wasm
      - name: upload the exact N10 wasm the upgrade scenario proved (for a real upgrade on testnet)
        uses: actions/upload-artifact@v4
        with:
          name: event_registration_waitlist-wasm
          path: tests/fixtures/near/target/wasm32-unknown-unknown/release/event_registration_waitlist.wasm
      - name: upload the exact escrow wasm files the second upgrade pair was proved with
        uses: actions/upload-artifact@v4
        with:
          name: escrow_v1-wasm
          path: tests/fixtures/near/target/wasm32-unknown-unknown/release/escrow_v1.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: escrow_v2-wasm
          path: tests/fixtures/near/target/wasm32-unknown-unknown/release/escrow_v2.wasm
