name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rulepack:
    name: rule-pack tests (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install with MCP extra
        run: python -m pip install -e '.[mcp]'
      - name: unit tests (incl. MCP stdio tests)
        run: python -m unittest discover -s tests -v
      - name: scan fixtures (expect 3 findings, exit 1)
        run: |
          set +e
          python -m bumm_guard scan tests/fixtures/near --format json > scan.json
          code=$?
          set -e
          python - <<'EOF'
          import json, sys
          d = json.load(open("scan.json"))
          ids = sorted(f["rule_id"] for f in d["findings"])
          assert ids == ["BG-NEAR-001", "BG-NEAR-002", "BG-NEAR-003"], ids
          print("fixtures OK:", ids)
          EOF
          test "$code" -eq 1
      - name: migration guard on the real fixtures (expect private)
        run: |
          python - <<'EOF'
          from bumm_guard.gate import migration_guard
          for crate in ("tests/fixtures/near/escrow_v2", "tests/fixtures/near/event_registration_waitlist"):
              status, detail = migration_guard(crate, "migrate")
              assert status == "private", (crate, status, detail)
              print(f"{crate}: migrate is #[private] at {detail['file']}:{detail['line']}")
          EOF

  ui-panel:
    name: ABI panel tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test ui/test
        run: node --test ui/test

  fixtures-compile:
    name: fixtures compile (cargo check, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install the fixtures' pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/fixtures/near
      - name: cargo check (host)
        working-directory: tests/fixtures/near
        run: cargo check --workspace --locked
      - name: cargo check (wasm32)
        working-directory: tests/fixtures/near
        run: cargo check --workspace --locked --target wasm32-unknown-unknown
      - name: swarm_jobs unit tests (host, stable rustc; the 1.85.0 pin is for the wasm build, dev-dependencies need >= 1.88)
        working-directory: tests/fixtures/near
        run: cargo +stable test --locked -p swarm_jobs
      - name: swarm_jobs_v2 unit tests (host, stable rustc; includes migrate() on a v1-shaped state)
        working-directory: tests/fixtures/near
        run: cargo +stable test --locked -p swarm_jobs_v2

  # Sandbox tests (near-workspaces / near-sandbox) run only on Linux: near-sandbox has no
  # Darwin-x86_64 binary. This job is enabled once contracts/ with sandbox tests exist.
  sandbox:
    name: sandbox tests (near-workspaces, linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: chk
        name: contracts present?
        run: |
          if ls contracts/*/Cargo.toml contracts/Cargo.toml >/dev/null 2>&1; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "no contracts/ yet - skipping"; fi
      - if: steps.chk.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.chk.outputs.has == 'true'
        name: install the fixtures' pinned toolchain (built by the test as a subprocess)
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - if: steps.chk.outputs.has == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            tests/fixtures/near
      - if: steps.chk.outputs.has == 'true'
        name: cargo test
        working-directory: contracts
        run: cargo test --workspace --locked

  simulate:
    name: scenario runner (bumm-sim on near-sandbox, linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: install the fixtures' pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            tests/fixtures/near
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build event_registration wasm (rustc 1.85.0)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p event_registration
      - name: build bumm-sim (rustc 1.99.1)
        working-directory: contracts
        run: cargo build --release --locked -p bumm-sim
      - name: run N06 scenarios
        run: |
          python -m bumm_guard simulate scenarios/n06/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/simulate-report.json
      - name: gate with simulate evidence (binds report to this wasm; blocks on failed scenarios)
        run: |
          python -m bumm_guard gate tests/fixtures/near/event_registration \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/event_registration.wasm \
            --simulate-report simulate-out/simulate-report.json --dry-run
      - name: build event_registration_waitlist wasm (rustc 1.85.0; N10 upgrade target)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p event_registration_waitlist
      - name: upgrade N06 -> N10 with migrate() (expected PASS)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/n06_to_n10_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/upgrade-with-migrate.json
      - name: upgrade N06 -> N10 code only (expected FAIL after the upgrade step)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/n06_to_n10_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/upgrade-code-only.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/upgrade-code-only.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          after = [s for s in sc["steps"] if s["index"] > up]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          # Every step after the upgrade, call and view alike, must name the contract's own failure
          # (the new code cannot read the old state), not only the RPC wrapper (FORMATS §3, error_detail).
          lacking = [s for s in after if "Cannot deserialize" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          views = [s for s in after if s["kind"] == "view"]
          assert views and all("Cannot deserialize" in s["actual"].get("error_detail", "") for s in views), views
          assert r["upgrade_wasm_sha256"] and sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"code-only upgrade: steps 0..{up} passed, {len(after)} step(s) after it failed with "
                f"'Cannot deserialize' ({len(views)} view steps), as expected")
          EOF
      - name: build escrow_v1, escrow_v2 and escrow_v3 wasm (rustc 1.85.0; second upgrade pair and its fixed version)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p escrow_v1 -p escrow_v2 -p escrow_v3
      - name: run escrow v1 scenarios
        run: |
          python -m bumm_guard simulate scenarios/escrow/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-report.json
      - name: gate escrow_v1 with its simulate evidence (fresh deploy, no upgrade proof needed)
        run: |
          python -m bumm_guard gate tests/fixtures/near/escrow_v1 \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/escrow_v1.wasm \
            --simulate-report simulate-out/escrow-report.json --dry-run
      - name: upgrade escrow v1 -> v2 with migrate() (expected PASS)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/escrow_v1_to_v2_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-upgrade-with-migrate.json
      - name: access probe on escrow v1 -> v2 - migrate() is open (near-sdk 5.17.2 drops #[private] on #[init]); the gate has no proof
        run: |
          python - <<'EOF'
          import json
          from bumm_guard.gate import find_upgrade_proof, migration_guard
          r = json.load(open("simulate-out/escrow-upgrade-with-migrate.json"))
          (sc,) = r["scenarios"]
          up = next(s for s in sc["steps"] if s["kind"] == "upgrade")
          init, before, probe = sc["state_after_init"], up["state_before"], up["access_probe"]
          assert before["keys"] > init["keys"] and before["sha256"] != init["sha256"], (init, before)
          # Same code, state and arguments as the real upgrade; the caller is an account that is neither
          # the contract nor a scenario account. escrow_v2 writes `#[private] #[init(ignore_state)]`, and
          # near-sdk 5.17.2 generates no caller check for it: the stranger's migrate goes through.
          assert probe["method"] == "migrate" and probe["status"] == "success", probe
          assert probe["by"] not in sc["accounts"].values(), probe
          assert probe["state_sha256"] == before["sha256"], (probe, before)
          assert up["passed"] and sc["passed"], up      # the scenario itself still passes: the probe is a record
          proof, notes = find_upgrade_proof(r, sc["wasm_sha256"], sc["upgrade_wasm_sha256"])
          assert proof is None and any("accepted a call from another account" in n for n in notes), (proof, notes)
          assert migration_guard("tests/fixtures/near/escrow_v2", "migrate")[0] == "private-unenforced"
          print(f"escrow v1 -> v2: state {init['keys']} -> {before['keys']} key(s) before the upgrade; migrate sent by "
                f"{probe['by']} on the not yet migrated state SUCCEEDED; the gate has no proof for this pair")
          EOF
      - name: upgrade escrow v1 -> v3 with migrate() (expected PASS; the access probe is refused, the gate has a proof)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/escrow_v1_to_v3_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-v3-upgrade-with-migrate.json
          python - <<'EOF'
          import json
          from bumm_guard.gate import find_upgrade_proof, migration_guard
          r = json.load(open("simulate-out/escrow-v3-upgrade-with-migrate.json"))
          (sc,) = r["scenarios"]
          up = next(s for s in sc["steps"] if s["kind"] == "upgrade")
          before, probe = up["state_before"], up["access_probe"]
          assert sc["passed"] and all(s["passed"] for s in sc["steps"]), sc
          assert probe["method"] == "migrate" and probe["status"] == "failure", probe
          assert "only the contract itself may migrate" in probe["error"], probe
          assert probe["state_sha256"] == before["sha256"], (probe, before)
          proof, notes = find_upgrade_proof(r, sc["wasm_sha256"], sc["upgrade_wasm_sha256"])
          assert proof and proof["access_probe"]["status"] == "failure" and proof["access_probe"]["same_state"], (proof, notes)
          assert proof["state_at_upgrade"]["changed_since_init"], proof
          assert migration_guard("tests/fixtures/near/escrow_v3", "migrate")[0] == "owner-check"
          print(f"escrow v1 -> v3: {len(sc['steps'])}/{len(sc['steps'])} steps passed; migrate sent by {probe['by']} on the "
                f"not yet migrated state was refused: {probe['error']}")
          EOF
      - name: upgrade escrow v1 -> v2 code only (expected FAIL after the first view; the smoke view lies)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/escrow_v1_to_v2_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/escrow-upgrade-code-only.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/escrow-upgrade-code-only.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          smoke = sc["steps"][up + 1]
          after = [s for s in sc["steps"] if s["index"] > up + 1]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          # The layout change sits inside a map record, not in the root struct, so the smoke view
          # right after the upgrade still answers correctly (deal_count 3): a smoke check cannot
          # see this upgrade failure. Only reading a record fails.
          assert smoke["kind"] == "view" and smoke["method"] == "deal_count" and smoke["passed"], smoke
          assert smoke["actual"]["value"] == 3, smoke
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          # near-sdk store's own message for a record it cannot read (not the root-struct one).
          lacking = [s for s in after if "Cannot deserialize element" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          views = [s for s in after if s["kind"] == "view"]
          assert views and all("Cannot deserialize element" in s["actual"].get("error_detail", "") for s in views), views
          assert r["upgrade_wasm_sha256"] and sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"escrow code-only upgrade: steps 0..{up} passed, deal_count right after it passed (value 3), "
                f"{len(after)} step(s) after that failed with 'Cannot deserialize element' ({len(views)} view steps), as expected")
          EOF
      - name: build swarm_jobs wasm (rustc 1.85.0; guarded jobs, docs/SWARM_JOBS.md)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p swarm_jobs
      - name: build swarm_jobs_v2 wasm (rustc 1.85.0; third upgrade pair, swarm_jobs v1 -> v2)
        working-directory: tests/fixtures/near
        run: cargo build --release --locked --target wasm32-unknown-unknown -p swarm_jobs_v2
      - name: hash guard (the seven fixture wasm files built in this job must equal evidence/wasm/SHA256SUMS)
        working-directory: tests/fixtures/near/target/wasm32-unknown-unknown/release
        run: |
          sha256sum event_registration.wasm event_registration_waitlist.wasm escrow_v1.wasm escrow_v2.wasm escrow_v3.wasm swarm_jobs.wasm swarm_jobs_v2.wasm
          grep -E '  (event_registration|event_registration_waitlist|escrow_v1|escrow_v2|escrow_v3|swarm_jobs|swarm_jobs_v2)\.wasm$' \
            "$GITHUB_WORKSPACE/evidence/wasm/SHA256SUMS" > "$RUNNER_TEMP/fixtures.sums"
          test "$(wc -l < "$RUNNER_TEMP/fixtures.sums")" -eq 7
          sha256sum --check --strict "$RUNNER_TEMP/fixtures.sums"
      - name: run swarm_jobs scenarios (review pays the agent; guardrails; cancel refunds)
        run: |
          python -m bumm_guard simulate scenarios/swarm_jobs/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/swarm-jobs-report.json
      - name: gate swarm_jobs with its simulate evidence (fresh deploy, binds the report to this wasm)
        run: |
          python -m bumm_guard gate tests/fixtures/near/swarm_jobs \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/swarm_jobs.wasm \
            --simulate-report simulate-out/swarm-jobs-report.json --dry-run
      - name: run swarm_jobs_v2 scenarios (storage fee and refund, pinned scenario, per-job floor, approve bindings, leave_swarm)
        run: |
          python -m bumm_guard simulate scenarios/swarm_jobs_v2/*.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/swarm-jobs-v2-report.json
      - name: gate swarm_jobs_v2 with its simulate evidence (fresh deploy, binds the report to this wasm)
        run: |
          python -m bumm_guard gate tests/fixtures/near/swarm_jobs_v2 \
            --wasm tests/fixtures/near/target/wasm32-unknown-unknown/release/swarm_jobs_v2.wasm \
            --simulate-report simulate-out/swarm-jobs-v2-report.json --dry-run
      - name: upgrade swarm_jobs v1 -> v2 with migrate() (expected PASS; the live testnet state, mirrored)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/swarm_jobs_v1_to_v2_with_migrate.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/swarm-jobs-upgrade-with-migrate.json
      - name: upgrade swarm_jobs v1 -> v2 code only (expected FAIL on every step that reads a job; four views lie)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/swarm_jobs_v1_to_v2_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/swarm-jobs-upgrade-code-only.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/swarm-jobs-upgrade-code-only.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          lying = sc["steps"][up + 1:up + 5]
          after = [s for s in sc["steps"] if s["index"] > up + 4]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          # The root struct and the agents map did not change between v1 and v2, so the four views that
          # read only them answer correctly right after a code-only upgrade: a smoke check cannot see this
          # upgrade failure. Only reading a job record fails.
          assert [s["method"] for s in lying] == ["job_count", "agent_count", "get_reviewer", "get_agent"], lying
          assert all(s["kind"] == "view" and s["passed"] for s in lying), lying
          assert lying[0]["actual"]["value"] == 2 and lying[1]["actual"]["value"] == 1, lying
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          # near-sdk store's own message for a record it cannot read (not the root-struct one).
          lacking = [s for s in after if "Cannot deserialize element" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          views = [s for s in after if s["kind"] == "view"]
          calls = [s for s in after if s["kind"] == "call"]
          assert views and all("Cannot deserialize element" in s["actual"].get("error_detail", "") for s in views), views
          assert len(calls) == 4, [s["method"] for s in calls]
          assert r["upgrade_wasm_sha256"] and sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"swarm_jobs code-only upgrade: steps 0..{up} passed, the 4 views right after it passed (job_count 2, "
                f"agent_count 1, get_reviewer, get_agent), {len(after)} step(s) after that failed with "
                f"'Cannot deserialize element' ({len(views)} view steps, {len(calls)} call steps), as expected")
          EOF
      - name: build the official near-sdk-rs example examples/versioned (pinned commit, unmodified) and our two old variants (rustc 1.85.0)
        run: scripts/build_official_example.sh
      - name: upgrade official example V0 era -> official code, code only (expected PASS without migrate)
        run: |
          python -m bumm_guard simulate scenarios/upgrade/official_versioned_v0_to_v1_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/official-versioned-v0-upgrade-report.json
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/official-versioned-v0-upgrade-report.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          assert sc["passed"] and sc.get("error") is None and all(s["passed"] for s in sc["steps"]), sc
          assert any(s["kind"] == "call" and s["index"] < up for s in sc["steps"]), "no state written before the upgrade"
          assert sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          nonces = [s["actual"]["value"] for s in sc["steps"] if s.get("method") == "get_nonce"]
          assert nonces == [0, 1, 2], nonces
          print(f"official V0 -> official code: {len(sc['steps'])}/{len(sc['steps'])} steps passed, upgrade at step {up}, "
                f"get_nonce {nonces} (V0 state read lazily, moved to V1 by the first new deposit), no migrate")
          EOF
      - name: access probe, negative - a migration method that anyone can call is recorded and the gate has no proof
        run: |
          python - <<'EOF'
          import json
          s = json.load(open("scenarios/upgrade/official_versioned_v0_to_v1_code_only.json"))
          up = next(i for i, st in enumerate(s["steps"]) if "upgrade" in st)
          # get_nonce stands in for a migration method with no access control: the contract can call it
          # in the upgrade batch, and so can anyone else.
          s["steps"][up]["migrate"] = {"method": "get_nonce"}
          s["steps"] = s["steps"][:up + 2]
          s["name"] = "access probe negative: a migration method anyone can call"
          json.dump(s, open("simulate-out/probe-open-scenario.json", "w"))
          EOF
          python -m bumm_guard simulate simulate-out/probe-open-scenario.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/probe-open-report.json
          python - <<'EOF'
          import json
          from bumm_guard.gate import find_upgrade_proof
          r = json.load(open("simulate-out/probe-open-report.json"))
          (sc,) = r["scenarios"]
          up = next(s for s in sc["steps"] if s["kind"] == "upgrade")
          assert sc.get("error") is None, sc["error"]
          assert up["actual"]["status"] == "success" and up["passed"], up
          assert up["access_probe"]["status"] == "success", up
          proof, notes = find_upgrade_proof(r, sc["wasm_sha256"], sc["upgrade_wasm_sha256"])
          assert proof is None and any("accepted a call from another account" in n for n in notes), (proof, notes)
          print(f"access probe negative: {up['access_probe']['by']} called get_nonce on the new code and it "
                "succeeded; the gate has no proof")
          EOF
      - name: state digest, negative - a view method sent as a transaction before the upgrade writes nothing
        run: |
          python - <<'EOF'
          import json
          s = json.load(open("scenarios/upgrade/official_versioned_v0_to_v1_code_only.json"))
          up = next(i for i, st in enumerate(s["steps"]) if "upgrade" in st)
          # The only step before the upgrade is a transaction that calls a read-only method.
          before = [{"call": "get_deposit", "by": "alice", "args": {"account_id": "alice"}, "expect": "ok"}]
          after = [{"call": "deposit", "by": "carol", "args": {}, "deposit": "3 NEAR", "expect": "ok"},
                   {"view": "get_nonce"}]
          s["steps"] = before + [s["steps"][up]] + after
          s["name"] = "state digest negative: nothing written before the upgrade"
          json.dump(s, open("simulate-out/nothing-written-scenario.json", "w"))
          EOF
          python -m bumm_guard simulate simulate-out/nothing-written-scenario.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/nothing-written-report.json
          python - <<'EOF'
          import json
          from bumm_guard.gate import find_upgrade_proof
          r = json.load(open("simulate-out/nothing-written-report.json"))
          (sc,) = r["scenarios"]
          up = next(s for s in sc["steps"] if s["kind"] == "upgrade")
          assert sc["passed"], sc      # every step passes: the scenario is honest, only empty
          assert sc["state_after_init"]["sha256"] == up["state_before"]["sha256"], (sc["state_after_init"], up["state_before"])
          proof, notes = find_upgrade_proof(r, sc["wasm_sha256"], sc["upgrade_wasm_sha256"])
          assert proof is None and any("identical to the state right after init" in n for n in notes), (proof, notes)
          print("state digest negative: the scenario passes, the state before the upgrade equals the state after "
                "init, and the gate refuses it as a proof")
          EOF
      - name: upgrade a plain-struct build -> official code, code only (expected FAIL after the upgrade step)
        run: |
          set +e
          python -m bumm_guard simulate scenarios/upgrade/official_versioned_plain_to_v1_code_only.json \
            --runner contracts/target/release/bumm-sim --out simulate-out/official-versioned-plain-upgrade-report.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (scenario failed), got $code"; exit 1; }
          python - <<'EOF'
          import json
          r = json.load(open("simulate-out/official-versioned-plain-upgrade-report.json"))
          (sc,) = r["scenarios"]
          up = next(s["index"] for s in sc["steps"] if s["kind"] == "upgrade")
          before = [s for s in sc["steps"] if s["index"] <= up]
          after = [s for s in sc["steps"] if s["index"] > up]
          assert sc.get("error") is None, sc["error"]
          assert all(s["passed"] for s in before), [s for s in before if not s["passed"]]
          assert after and all(not s["passed"] and s["actual"]["status"] == "failure" for s in after), after
          lacking = [s for s in after if "Cannot deserialize" not in s["actual"].get("error", "")]
          assert not lacking, [(s["index"], s["kind"], s["actual"].get("error")) for s in lacking]
          assert sc["steps"][up]["actual"]["code_sha256"] == r["upgrade_wasm_sha256"]
          print(f"plain struct -> official code: steps 0..{up} passed, all {len(after)} step(s) after it failed with "
                f"'Cannot deserialize', as expected; first error: {after[0]['actual'].get('error_detail') or after[0]['actual']['error']}")
          EOF
      - name: hash guard (the official-example wasm files built in this job must equal evidence/wasm/SHA256SUMS)
        working-directory: tests/fixtures/near_official/target/wasm32-unknown-unknown/release
        run: |
          sha256sum versioned.wasm versioned_v0.wasm versioned_plain.wasm
          grep -E '  versioned(_v0|_plain)?\.wasm$' "$GITHUB_WORKSPACE/evidence/wasm/SHA256SUMS" > "$RUNNER_TEMP/official.sums"
          test "$(wc -l < "$RUNNER_TEMP/official.sums")" -eq 3
          sha256sum --check --strict "$RUNNER_TEMP/official.sums"
